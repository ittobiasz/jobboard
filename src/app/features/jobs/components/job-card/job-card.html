<a class="job-row" [routerLink]="['/jobs', job().id]">
  <span class="job-row__index">{{ positionLabel() }}</span>

  <span class="job-row__mark" aria-hidden="true">{{ mark() }}</span>

  <span class="job-row__main">
    <span class="job-row__title">{{ job().title }}</span>
    <span class="job-row__company">{{ job().company }}</span>
  </span>

  <span class="job-row__meta">
    <span class="job-row__location">{{ job().location }} · {{ job().employmentType }}</span>
    <span class="job-row__salary">{{ job().salary }}</span>
  </span>

  <span class="badge job-row__category">{{ job().category }}</span>

  <span class="job-row__arrow" aria-hidden="true">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <path d="M3 9H15M15 9L10 4M15 9L10 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </span>
</a>
